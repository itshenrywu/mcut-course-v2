<!doctype html>
<html lang="zh-TW">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="robots" content="noindex, nofollow" />
		<link rel="icon" href="/favicon.ico?v=20260806" sizes="48x48">
		<link rel="icon" type="image/png" href="/favicon-96x96.png?v=20260806" sizes="96x96">
		<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20260806">
		<title>裝置資料 | 明志科技大學選課小幫手</title>
		<script>
			try {
				const stored = localStorage.getItem('mcv2-theme')
				const dark = stored === 'dark' || ((stored === 'auto' || !stored) && matchMedia('(prefers-color-scheme: dark)').matches)
				if (dark) document.documentElement.classList.add('dark')
			} catch (e) {}
		</script>
	</head>
	<body>
		<div id="app"></div>
		<script type="module" src="/src/debug/main.js"></script>
	</body>
</html>
